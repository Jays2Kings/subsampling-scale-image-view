apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

archivesBaseName = 'subsampling-scale-image-view-androidx'

android {
    namespace 'com.davemorrissey.labs.subscaleview'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34

        versionCode = 1
        versionName = "1.0"

        consumerProguardFiles 'proguard-rules.txt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release')
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'com.github.mihonapp:image-decoder:e03b81e18a'
}

afterEvaluate {
    publishing {
        publications {
            create('release', MavenPublication) {
                groupId = 'com.github.jays2kings'
                artifactId = 'subsampling-scale-image-view'
                version = project.version

                from components.release
            }
        }
    }
}
